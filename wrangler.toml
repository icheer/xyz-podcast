name = "xyz-podcast"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__scheduled"]

[[d1_databases]]
binding = "DB"
database_name = "xyz-podcast-db"
database_id = "224bbab0-b5e7-4547-9735-9038d63b8f53"
migrations_dir = "migrations"

[triggers]
# 08:00-08:30 Beijing time, then again at 10:00 and 18:00 if the run is not finished.
crons = ["0-30/2 0,2,10 * * *"]
