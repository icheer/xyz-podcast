<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="小宇宙热门播客排行榜与在线收听端" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小宇宙热榜" />
  <title>小宇宙热榜 · XYZ Podcast</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" sizes="256x256" href="/icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>[v-cloak] { display: none; }</style>
  <script>
    // Run before stylesheet & CDN scripts to prevent Dark Mode FOUC and lock WeChat text scaling.
    (() => {
      try {
        const prefs = JSON.parse(localStorage.getItem("xyzp_v1_prefs") || "{}");
        const isDark = prefs.theme
          ? prefs.theme === "dark"
          : Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        const theme = isDark ? "dark" : "light";
        const themeColor = isDark ? "#111114" : "#f7f4ec";
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelectorAll('meta[name="theme-color"]').forEach((el) => {
          el.setAttribute("content", themeColor);
        });
        const appleBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (appleBar) appleBar.setAttribute("content", isDark ? "black-translucent" : "default");
      } catch {}

      if (!/MicroMessenger/i.test(navigator.userAgent)) return;
      document.documentElement.setAttribute("data-wechat", "true");
      let subscribedBridge;

      function resetFontSize() {
        const bridge = window.WeixinJSBridge;
        if (typeof bridge?.invoke !== "function") return;
        try {
          bridge.invoke("setFontSizeCallback", { fontSize: 0 }, () => {});
        } catch {
          // Some clients do not expose this native API; CSS still fixes text inflation.
        }
      }

      function onBridgeReady() {
        resetFontSize();
        const bridge = window.WeixinJSBridge;
        if (typeof bridge?.on !== "function" || bridge === subscribedBridge) return;
        try {
          bridge.on("menu:setfont", resetFontSize);
          subscribedBridge = bridge;
        } catch {
          // Keep the page usable when the host does not support this bridge event.
        }
      }

      document.addEventListener("WeixinJSBridgeReady", onBridgeReady);
      window.addEventListener("pageshow", onBridgeReady);
      onBridgeReady();
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css?v=45" />
  <script defer src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js"></script>
  <script defer src="https://unpkg.com/vue-router@4.6.5/dist/vue-router.global.prod.js"></script>
  <script defer src="https://unpkg.com/lucide@1.74.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="app" v-cloak></div>
  <script type="module" src="/js/app.js?v=53"></script>
</body>
</html>
